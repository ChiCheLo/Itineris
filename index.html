<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f4ef" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#131210" media="(prefers-color-scheme: dark)">
<title>Itineris 行程規劃</title>
<meta name="description" content="安排每日行程、景點與交通的旅遊規劃工具">
<!-- PWA：加到主畫面後像 App 一樣全螢幕開啟（第 7 步） -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Itineris">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- 襯線標題字：Newsreader（英數）＋ 思源宋體（中文，Google Fonts 會依用到的字分段下載）；沒網路時退回系統襯線字 -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,600&family=Noto+Serif+TC:wght@500;600&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- 標題列：Logo 與帳號（登出），登入後固定在所有頁面最上方 -->
  <header id="appbar" class="appbar" hidden></header>
  <div id="app" class="app"></div>
  <nav id="tabbar" class="tabbar" aria-label="主要分頁" hidden></nav>

  <dialog id="sheet" class="sheet" aria-label="編輯"></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <!-- ES module：需要用網址開啟（npm run dev），雙擊檔案開不起來；Google 登入本來就需要網址 -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
